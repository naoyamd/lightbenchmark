@media(max-width:520px){.chat-answer{font-size:13px;line-height:1.9}.arm-svg{height:210px}.task-card[data-task="arm"] .scene,.task-card[data-task="cube"] .scene{height:210px;min-height:210px}.cube-help{font-size:10px}.puyo-options select,.puyo-options button{font-size:10px}}


.task-card[data-task="cube"]{align-self:start}.task-card[data-task="arm"] .card-body{display:block}.task-card[data-task="arm"] .scene{display:block;height:auto;min-height:0;overflow:hidden;background:#12312f}.task-card[data-task="arm"] .scene-top{display:none}.task-card[data-task="arm"] .result-area{padding:11px 15px 10px;display:block}.stack-svg{display:block;width:100%;height:auto}.stack-goal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#1c4039;border-bottom:1px solid #44675a;color:#cce1ca;font-size:11px}.size-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#ecf1d8}.size-chip i{display:inline-block;vertical-align:middle;border:1px solid #ffffff44;border-radius:2px}.size-chip.medium i{width:20px;height:15px;background:#e47d6b}.size-chip.small i{width:14px;height:11px;background:#7fb6df}.size-chip.large i{width:27px;height:19px;background:#e8c969}.size-chip.complete{color:#daf9a4}.stack-target-label{margin-left:auto;color:#9abbab;font-size:9px}.stack-score-strip{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.stack-score-strip>div>span{display:block;color:var(--muted);font-size:9px}.stack-score-strip strong{font:600 20px/1.4 var(--mono);letter-spacing:-.5px}.stack-score-strip small{font:9px 'Segoe UI',sans-serif;color:var(--muted)}.stack-score-strip .stack-outcome{margin-left:auto;font-size:11px;color:var(--green);max-width:180px}.stack-caption{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.7}
@media(max-width:760px){.stack-goal{gap:5px;padding:9px 10px;font-size:10px}.size-chip{font-size:10px;gap:3px}.stack-target-label{display:none}.stack-score-strip{gap:11px}.stack-score-strip strong{font-size:18px}.stack-score-strip .stack-outcome{margin-left:0;width:100%;font-size:10px}.stack-caption{font-size:9px}.task-card[data-task="arm"] .result-area{padding:10px 12px}}

<body>
<header class="topbar"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>LightBenchmark</a><div class="topbar-right"><a href="../" style="font-size:11px">ベンチマークへ戻る</a><button id="visual-button">共通スターター</button><span class="mock-badge">動作デモ / LLM未実行</span></div></header>
<main>
<nav class="model-nav" aria-label="モデル選択"><span>モデル</span><a class="model-link" href="#model-a" data-model="0"><b>a</b>モデル A</a><a class="model-link" href="#model-b" data-model="1" aria-current="page"><b>b</b>モデル B</a><a class="model-link" href="#model-c" data-model="2"><b>c</b>モデル C</a><span class="demo-note">回答・解法・制御器は参考実装です</span></nav>
<section class="model-overview" aria-label="モデル概要"><div class="identity"><span id="model-icon" class="model-icon" aria-hidden="true">b</span><div><h1 id="model-name">モデル B</h1><p>日本語・18連鎖・キューブ・ロボットアームの4課題</p><div class="subline" id="model-meta"></div></div></div><dl class="overview-metrics" id="model-metrics"></dl></section>

<script type="module">

import {makePuyoDemo,makeCubeDemo,puyoFalls} from './demo-generators.mjs';
import {createStackDemo} from './arm-stack.mjs';
import {createStackScene,stackPhase} from './arm-stack-view.mjs';
import {createCubeView} from './cube-view.mjs';
const taskOrder=['chat','puyo','cube','arm'];
const tasks={
 chat:{number:'01',name:'日本語チャット',subtitle:'ギャル口調の紹介文をそのまま全文表示'},
 puyo:{number:'02',name:'18連鎖・全消し',subtitle:'配置から連鎖まで、消去と落下を分けて再生'},
 cube:{number:'03',name:'3Dキューブ',subtitle:'ドラッグで全体を回転・各手の面回転を再生'},
 arm:{number:'04',name:'ロボットアーム',subtitle:'下から中 → 小 → 大。手を離して3秒安定させる'}
};
const introductions=[
 `糸島って、福岡県の西側にあるまちなんだけど、海も山も近いのがめっちゃいいんだよね✨ 北には玄界灘、南には山々があって、景色ががらっと変わるのも楽しい！

海の景色なら桜井二見ヶ浦、山側なら白糸の滝があるよ。写真を撮りに行くのもいいし、景色を眺めてのんびりするのもアリ。予定を詰めすぎず、その日の気分で過ごしたくなる感じ🌿

あと、お魚や地元の野菜も気になるところ！ 海を見て、おいしいものを食べて、帰りに食材を買う休日とか最高じゃん💛`,
 `糸島、海のイメージ強いけど、山の景色も楽しめるの知ってた？ 福岡県の西側にあるまちで、北には玄界灘、南には山々が広がってるんだよ〜✨

桜井二見ヶ浦みたいな海沿いの景色も、白糸の滝みたいな山側のスポットもあって、どっちに行くか迷うやつ。写真を撮るのもいいけど、海を眺めてぼーっとする時間もほしいよね🌊

海の幸に地元の野菜もあるから、景色だけで終わらないのも好き！ 友だちとお出かけして、食べたいものを探すだけでも楽しそう。自然のあるところで気分転換したい日に、候補に入れてほしいまちだよ💛`,
 `糸島は福岡県の西部にある、海と山に囲まれたまちだよ。北側には玄界灘、南側には山々が広がっていて、自然の景色を楽しめるのが魅力✨

桜井二見ヶ浦の海や白糸の滝など、行ってみたい場所がいろいろあるよ。海産物や地元の野菜もあるから、景色と食事を一緒に楽しむお出かけによさそう！

海派の友だちとも山派の友だちとも、行き先を相談しやすいまちだと思うよ。`
];
function chatAnswer(model){return introductions[model];}
const PUYO_TIMING={place:240,highlight:380,erase:150,fall:300,settle:170};
function modelFromHash(hash){const match=/^#model-([abc])$/.exec(hash);return match?'abc'.indexOf(match[1]):1;}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(value,digits=2){return Number.isFinite(value)?value.toFixed(digits):'—';}
const phaseLabels={approach:'箱に近づく',grip:'箱をつかむ',lift:'持ち上げる',transfer:'置き場へ運ぶ',place:'ゆっくり下ろす',release:'箱を置く',done:'搬送完了',settle:'姿勢を安定させる',failed:'動作を停止'};
// DOM
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let selectedModel=modelFromHash(location.hash),activeTask=null,puyoSpeed=1,cubeView=null,stackScene=null;
let seeds={},demos={},steps={},playSerial=0,waitTimer=null,finishWait=null,puyoAnimations=[];
function freshSeed(previous){let seed;do{seed=crypto.getRandomValues(new Uint32Array(1))[0];}while(seed===previous);return seed;}
function buildDemo(id){demos[id]=id==='puyo'?makePuyoDemo(seeds[id]):id==='cube'?makeCubeDemo(seeds[id]):createStackDemo(seeds[id],selectedModel);steps[id]=id==='cube'?demos[id].scramble.length:0;if(id==='arm')stackScene=createStackScene(demos.arm);}
function initializeAll(newSeeds=true){stopReplay();for(const id of taskOrder.filter(x=>x!=='chat')){if(newSeeds||seeds[id]===undefined)seeds[id]=freshSeed(seeds[id]);buildDemo(id);}render();}
function boardMarkup(board){return `<div class="board" aria-hidden="true">${board.toReversed().map((row,ry)=>row.map((c,x)=>`<i class="cell" data-color="${c}" data-x="${x}" data-y="${13-ry}"></i>`).join('')).join('')}</div>`;}
function puyoScene(){const f=demos.puyo.frames[steps.puyo];return boardMarkup(f.board)+`<div class="chain-counter"><strong>${String(f.chain).padStart(2,'0')}</strong><span>/ 18 連鎖</span><b>${Math.min(steps.puyo,36)} / 36 組</b></div>`;}
function cubeScene(){return '<div id="cube-host" class="cube-host"></div><span class="cube-count" id="cube-move-label"></span>';}
function armScene(){
 const f=demos.arm.frames[steps.arm];
 return `<div class="stack-goal"><span>下から</span><b class="size-chip medium ${f.stackCount>=1?'complete':''}"><i></i>① 中</b><span>→</span><b class="size-chip small ${f.stackCount>=2?'complete':''}"><i></i>② 小</b><span>→</span><b class="size-chip large ${f.stackCount>=3?'complete':''}"><i></i>③ 大</b><span class="stack-target-label">半透明の形に積む</span></div>${stackScene(steps.arm)}`;
}
function phaseText(id){const f=demos[id].frames[steps[id]];return id==='puyo'?(f.phase==='chain'?`${f.chain}連鎖 / 残り${f.board.flat().filter(Boolean).length}個`:`${f.phase==='trigger'?'発火':'配置'} ${Math.min(steps.puyo,36)}/36組`):id==='cube'?(f.phase==='scramble'?`スクランブル ${f.index}/25手`:`解答 ${f.index}/25手`):stackPhase(f);}
function sceneFor(id){return `<div class="scene" role="group" aria-label="${tasks[id].name}のリプレイ"><div class="scene-top"><span>参考実装</span><strong>seed ${seeds[id].toString(16).padStart(8,'0')}</strong></div>${{puyo:puyoScene,cube:cubeScene,arm:armScene}[id]()}${id==='arm'?'':`<div class="scene-bottom">${phaseText(id)}</div>`}</div>`;}
function resultMarkup(id){
 const d=demos[id];
 if(id==='puyo')return `<div class="result-label">計画の検算</div><h3 class="result-value">${d.chainCount}連鎖・全消し</h3><p class="result-note">35組を積み、最後の1組で発火。消去と落下を分けて再生します。</p><div class="puyo-options"><label>連鎖速度 <select id="puyo-speed" aria-label="ぷよの連鎖速度"><option value="1" ${puyoSpeed===1?'selected':''}>標準：約1秒 / 連鎖</option><option value="1.5" ${puyoSpeed===1.5?'selected':''}>ゆっくり：約1.5秒</option></select></label><button id="chain-start">連鎖から再生</button></div><div class="phase-label" data-phase="puyo">${phaseText('puyo')}</div><div class="sequence">次の5組：${d.setupPairs.slice(0,5).map(p=>`${p.x+1}列[${p.colors.join(',')}]`).join(' → ')}</div><p class="seed-label">参考実装は同じ連鎖骨格の変形。配色・反転・配置順を初期化で再生成。</p>`;
 if(id==='cube')return `<div class="result-label">スクランブル</div><h3 class="result-value">${d.scramble.length}手</h3><div class="sequence" data-scramble>${d.scramble.map(escapeHtml).join(' ')}</div><p class="result-note">マウスでドラッグすると裏側や底面も確認できます。各手は面の回転として再生します。</p><div class="cube-help"><span>矢印キーでも視点を回転</span></div><p class="seed-label">モックの解答は逆手順。本番は生成履歴を隠して解かせ、各手のアニメーションも評価します。</p>`;
 const f=d.frames[steps.arm],m=d.metrics;
 return `<div class="stack-score-strip"><div><span>積み上げ</span><strong>${f.stackCount}<small> / 3</small></strong></div><div><span>手を離して安定</span><strong>${fmt(f.stableSeconds)}<small> / 3.0 秒</small></strong></div><div><span>経過時間</span><strong>${fmt(f.t)}<small> 秒</small></strong></div><div class="stack-outcome">${steps.arm===d.frames.length-1?(m.success?'積み上げ成功':'試行終了'):stackPhase(f)}</div></div><p class="stack-caption">小サイズの上に大サイズを置くため、中心合わせと指の開き幅が重要。指・箱・床の接触と摩擦を物理計算しています。</p>`;
}

function updateScene(id){
 if(id==='cube'){cubeView?.setState(demos.cube.frames[steps.cube].state);$('[data-task="cube"] .scene-bottom').textContent=phaseText(id);$('#cube-move-label').textContent=demos.cube.frames[steps.cube].move||'開始';}
 else $(`[data-scene="${id}"]`).innerHTML=sceneFor(id);
 $(`[data-range="${id}"]`).value=steps[id];$(`[data-step="${id}"]`).textContent=`${steps[id]}/${demos[id].frames.length-1}`;
 const phase=$(`[data-phase="${id}"]`);if(phase)phase.textContent=phaseText(id);
 if(id==='arm')$('[data-task="arm"] .result-area').innerHTML=resultMarkup('arm');
 if(!activeTask||steps[id]===demos[id].frames.length-1)$('#live-status').textContent=tasks[id].name+'、'+phaseText(id);
}
function stopReplay(){
 const previous=activeTask;playSerial++;activeTask=null;clearTimeout(waitTimer);waitTimer=null;const resolve=finishWait;finishWait=null;resolve?.();
 for(const a of puyoAnimations)a.cancel();puyoAnimations=[];cubeView?.cancel();
 $$('[data-play]').forEach(b=>{b.textContent='▶ 再生';b.setAttribute('aria-pressed','false');});
 if(previous&&demos[previous]&&$(`[data-scene="${previous}"]`))updateScene(previous);
}
function pause(ms){return new Promise(resolve=>{finishWait=resolve;waitTimer=setTimeout(()=>{waitTimer=null;finishWait=null;resolve();},ms);});}
async function animateNodes(nodes,keyframes,duration){const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const animations=nodes.map((el,index)=>el.animate(typeof keyframes==='function'?keyframes(el,index):keyframes,{duration:reduced?0:duration,easing:'ease-in-out',fill:'forwards'}));puyoAnimations.push(...animations);await Promise.allSettled(animations.map(a=>a.finished));}
async function animatePuyo(next,token){
 const board=$('[data-task="puyo"] .board'),before=demos.puyo.frames[steps.puyo].board;
 const cell=(x,y)=>board.querySelector(`[data-x="${x}"][data-y="${y}"]`);
 const pitch=cell(0,0).getBoundingClientRect().top-cell(0,1).getBoundingClientRect().top;
 if(next.phase!=='chain'){
  board.outerHTML=boardMarkup(next.board);const placed=[];
  for(let y=0;y<14;y++)for(let x=0;x<6;x++)if(next.board[y][x]&&!before[y][x])placed.push($(`[data-task="puyo"] .cell[data-x="${x}"][data-y="${y}"]`));
  await animateNodes(placed,el=>[{transform:`translateY(-${(14-Number(el.dataset.y))*pitch}px)`},{transform:'translateY(0)'}],PUYO_TIMING.place);return;
 }
 const clears=next.cleared.map(([x,y])=>cell(x,y));
 $('[data-task="puyo"] .chain-counter strong').textContent=String(next.chain).padStart(2,'0');
 $('[data-task="puyo"] .scene-bottom').textContent=`${next.chain}連鎖：消去するぷよ`;
 await animateNodes(clears,[{filter:'brightness(1)',transform:'scale(1)'},{filter:'brightness(2)',transform:'scale(1.2)'},{filter:'brightness(1.5)',transform:'scale(1.1)'}],PUYO_TIMING.highlight*puyoSpeed);
 if(token!==playSerial)return;
 await animateNodes(clears,[{opacity:1,transform:'scale(1.1)'},{opacity:0,transform:'scale(.15)'}],PUYO_TIMING.erase*puyoSpeed);
 if(token!==playSerial)return;
 $('[data-task="puyo"] .scene-bottom').textContent=`${next.chain}連鎖：落下`;
 const falls=puyoFalls(before,next.cleared).filter(m=>m.fromY!==m.toY);
 await animateNodes(falls.map(m=>cell(m.x,m.fromY)),(el,i)=>[{transform:'translateY(0)'},{transform:`translateY(${(falls[i].fromY-falls[i].toY)*pitch}px)`}],PUYO_TIMING.fall*puyoSpeed);
 if(!falls.length)await pause(PUYO_TIMING.fall*puyoSpeed);
}
async function playTask(id){
 const wasActive=activeTask===id;stopReplay();if(wasActive)return;
 if(steps[id]===demos[id].frames.length-1){steps[id]=id==='cube'?demos[id].scramble.length:0;updateScene(id);}
 const token=playSerial;activeTask=id;const button=$(`[data-play="${id}"]`);button.textContent='Ⅱ 停止';button.setAttribute('aria-pressed','true');
 try{while(token===playSerial&&steps[id]<demos[id].frames.length-1){
  const next=demos[id].frames[steps[id]+1];
  if(id==='cube')await cubeView.turn(next.move,next.state,{duration:next.move.endsWith('2')?700:520});
  else if(id==='puyo')await animatePuyo(next,token);
  else await pause(50);
  if(token!==playSerial)return;
  steps[id]++;updateScene(id);puyoAnimations=[];
  if(id==='puyo'&&next.phase==='chain')await pause(PUYO_TIMING.settle*puyoSpeed);
  if(id==='cube')await pause(90);
 }
 if(token===playSerial)stopReplay();
 }catch(error){stopReplay();console.error(error);$('#live-status').textContent='再生を停止しました。初期化して再度お試しください。';}
}
function renderChat(){return `<article class="task-card chat-card" data-task="chat" aria-labelledby="title-chat"><header class="task-header"><div class="task-heading"><span class="task-number">01</span><div><h2 id="title-chat">日本語チャット</h2><small>生成された紹介文の自然さ・ギャル口調を比較</small></div></div><span class="status">表示例</span></header><div class="card-body"><p class="chat-caption">「ギャルっぽく糸島を紹介して」</p><div class="chat-answer">${escapeHtml(chatAnswer(selectedModel))}</div><div class="chat-summary">本番ではモデルの返答を添削せず、そのまま全文表示します。</div></div><footer class="task-controls"><span class="source-tag">参考の紹介文 / モデル未実行</span><button class="detail-button" data-detail="chat">詳細 ↗</button></footer></article>`;}
function render(){
 cubeView?.destroy();cubeView=null;
 const letter='ABC'[selectedModel];document.title=`モデル ${letter} — LightBenchmark`;$('#model-name').textContent=`モデル ${letter}`;$('#model-icon').textContent=letter.toLowerCase();$('#model-meta').textContent='架空モデル / 回答・解法・制御器は操作確認用の参考実装';
 $$('[data-model]').forEach(a=>{if(Number(a.dataset.model)===selectedModel)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 $('#model-metrics').innerHTML='<div><dt>課題</dt><dd>4</dd></div><div><dt>モデル実行</dt><dd><small>未実施</small></dd></div><div><dt>token・費用</dt><dd><small>未計測</small></dd></div>';
 $('#task-grid').innerHTML=renderChat()+taskOrder.filter(x=>x!=='chat').map(id=>{const t=tasks[id],d=demos[id];return `<article class="task-card" data-task="${id}" aria-labelledby="title-${id}"><header class="task-header"><div class="task-heading"><span class="task-number">${t.number}</span><div><h2 id="title-${id}">${t.name}</h2><small>${t.subtitle}</small></div></div><span class="status">動作見本</span></header><div class="card-body"><div class="visual-area" data-scene="${id}">${sceneFor(id)}</div><div class="result-area">${resultMarkup(id)}</div></div><footer class="task-controls"><button class="reset-button" data-reset="${id}" aria-label="${t.name}を初期化">↻ 初期化</button><button class="play-button" data-play="${id}" aria-label="${t.name}を再生" aria-pressed="false">▶ 再生</button><input class="replay-range" type="range" min="0" max="${d.frames.length-1}" step="1" value="${steps[id]}" data-range="${id}" aria-label="${t.name}の再生位置"><span class="replay-step" data-step="${id}">${steps[id]}/${d.frames.length-1}</span><button class="detail-button" data-detail="${id}">詳細 ↗</button></footer></article>`;}).join('');
 cubeView=createCubeView($('#cube-host'),demos.cube.frames[steps.cube].state,{label:'キューブの視点操作。ドラッグまたは矢印キーで回転',resetLabel:'視点リセット'});updateScene('cube');
 $('#live-status').textContent=`モデル${letter}の4課題を表示。日本語は紹介文をそのまま全文表示。`;
}
function openDialog(title,body){stopReplay();$('#dialog-content').innerHTML=`<h2 id="dialog-title">${title}</h2>${body}`;$('#detail-dialog').showModal();}
function showDetail(id){
 if(id==='chat'){openDialog('日本語チャットの課題','<p>プロンプトは「ギャルっぽく糸島を紹介して」。紹介文を自由に生成させ、返答をそのまま全文表示します。正誤クイズや指定項目への分割は行いません。</p><p>ギャル口調の自然さ、読みやすさ、紹介としての内容、事実の正確さをそれぞれ評価します。絵文字の個数だけで口調の良さを決めず、プラットフォーム側で文体を補正しません。</p><p class="dialog-note">現在の文章は表示確認用の参考例です。実際のモデル出力に接続する際も、原文を保持します。</p><p><a href="https://www.city.itoshima.lg.jp/m/page/030/profile.html" target="_blank" rel="noreferrer">紹介例の地理情報の参考資料</a></p>');return;}
 if(id==='puyo'){const d=demos.puyo;openDialog('18連鎖の配置計画と再生',`<p>初期化で35組の配置と発火の1組を生成し、合法配置から18連鎖・全消しすることを検算しています。</p><p>連鎖の標準速度は、強調380ms、消去150ms、落下300ms、間170msの計約1秒。「ゆっくり」は1.5倍です。特定の製品・機種のフレーム単位の完全再現ではなく、連鎖を追える速度に調整しています。</p><p class="dialog-note">モックは既存の連鎖骨格を使います。正式課題はモデル自身の計画と内部ロジックを検査します。</p><pre class="modal-code">${escapeHtml([...d.setupPairs,d.triggerPair].map((p,i)=>`${i+1}: 列${p.x+1} / 回転${p.rotation} / 色 ${p.colors.join(',')}`).join('\n'))}</pre>`);return;}
 if(id==='cube'){openDialog('3D表示と各手のアニメーション','<p>六面を実際に描画し、ドラッグで視点を自由に回します。矢印キーでも視点を変えられます。カメラ操作でキューブ内部の状態は変わりません。</p><p>再生では操作する面と隣接する列を90度または180度回転させ、その終端を状態ログと照合します。本番でも、全体の視点操作・各手の面回転・論理状態との一致を提出要件に含めます。</p><p class="dialog-note">モックの解答はスクランブルの逆順です。正式課題は生成履歴をソルバーに渡さず、盤面から解かせます。アニメーションの見た目だけで完成扱いにはしません。</p>');return;}
 openDialog('中 → 小 → 大の積み上げ',`<p>①中サイズを土台にし、②小サイズ、その上に③大サイズを積みます。完成形は半透明で常時表示します。3個目を離し、指を退避させてから3秒間安定すれば成功です。</p><h3>サイズ差を考慮する箇所</h3><p>指の開き幅、把持する高さ、仕切りを越える高さ、置く位置を各ブロックに合わせます。特に大サイズは小サイズから左右に張り出すので、中心がずれると傾いて落下します。</p><h3>物理と制御</h3><p>Planck.jsの重力・接触・摩擦で箱を保持・解放・積み重ねます。箱を手先に固定する処理は使いません。関節モーターは観測した角度に基づくフィードバックで動かし、出力を制限します。</p><h3>評価</h3><p>正しいサイズ順での1段・2段・3段、解放後の安定時間、落下・衝突、所要時間を別々に記録します。座標が近いだけでは積み上がったと判定しません。</p><p class="dialog-note">このモックは共通物理と参考制御器の動作見本です。モデルの実測結果ではありません。</p><p><a href="https://piqnt.com/planck.js/docs/" target="_blank" rel="noreferrer">物理エンジン：Planck.js 1.5.0</a></p>`);

}
function showStarter(){openDialog('共通部分とモデルの実装範囲','<p>表示領域、基本配色、物体の形、初期化・再生、最低限の操作を共通にします。</p><p>モデルは紹介文、ぷよの計画と消去ロジック、キューブの状態更新・解法・各手のアニメーション、アームの状態推定と制御器を実装します。キューブのカメラ操作は共通の操作部品を利用しても構いません。</p><p>アームの力学は共通の試験環境として固定し、候補から座標や成功判定を変更できなくします。参考解法や制御器は候補モデルへ配りません。</p>');}
window.addEventListener('hashchange',()=>{selectedModel=modelFromHash(location.hash);initializeAll(false);});
$('#reset-all').addEventListener('click',()=>initializeAll(true));
$('#task-grid').addEventListener('click',e=>{
 const reset=e.target.closest('[data-reset]'),play=e.target.closest('[data-play]'),detail=e.target.closest('[data-detail]');
 if(reset){const id=reset.dataset.reset;stopReplay();seeds[id]=freshSeed(seeds[id]);buildDemo(id);render();$(`[data-reset="${id}"]`).focus();return;}
 if(play){void playTask(play.dataset.play);return;}
 if(detail){showDetail(detail.dataset.detail);return;}
 if(e.target.closest('#chain-start')){stopReplay();steps.puyo=36;updateScene('puyo');void playTask('puyo');return;}
});
$('#task-grid').addEventListener('input',e=>{const id=e.target.dataset.range;if(id){stopReplay();steps[id]=Number(e.target.value);updateScene(id);}});
$('#task-grid').addEventListener('change',e=>{if(e.target.id==='puyo-speed'){stopReplay();puyoSpeed=Number(e.target.value);}});
$('#visual-button').addEventListener('click',showStarter);$('#starter-footer').addEventListener('click',showStarter);
$('#conditions-button').addEventListener('click',()=>openDialog('このモックの実行条件','<p>モデルの推論は実行していません。文章・解法・制御器は表示と操作を確認するための参考実装です。</p><p>モデル切替では同じseedを保持し、初期化でその課題のseedを更新します。正式比較では同じ未公開seed集合と評価器、予算を全モデルに使います。token・費用は実測するまで未計測とします。</p>'));
$('#review-button').addEventListener('click',()=>openDialog('今回のレビュー対象','<ul><li>紹介文の内容とギャル口調をそのまま読めるか</li><li>ぷよの消去と落下を追える速度になっているか</li><li>キューブを自由に回し、各手の回転を確認できるか</li><li>中→小→大の順とサイズ差、把持・積み上げの成否が分かるか</li></ul><p>モデル別の4課題ページは維持しています。本番反映とモデル実行はレビュー後の工程です。</p>'));
$('#close-dialog').addEventListener('click',()=>$('#detail-dialog').close());
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopReplay();});
initializeAll(true);

</script>
</body>
</html>
