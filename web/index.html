<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf3f7">
    <title>LightBenchmark</title>
    <link rel="stylesheet" href="./styles.css?v=2">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <a id="page-nav" class="page-nav" href="./" hidden>← モデル一覧</a>
        <p class="eyebrow">LIGHTBENCHMARK</p>
        <h1 id="page-title">結果を先に、<span>実演で確認。</span></h1>
        <p id="page-lede" class="lede">独立評価と実際のビジュアルを、モデルごと・課題ごとに同じ画面で確認できます。</p>
      </header>

      <section id="results" class="results" aria-live="polite">
        <div class="loading">結果を読み込み中…</div>
      </section>
    </main>

    <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title">
      <button id="dialog-close" class="dialog-close" type="button" aria-label="詳細を閉じる">×</button>
      <div id="detail-content"></div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
